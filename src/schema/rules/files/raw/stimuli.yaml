# Stimulus files in the root-level /stimuli directory.
# As with phenotype, the parent directory is encoded as the datatype;
# the dataset-wide stimuli.tsv and annotations.tsv tables are in
# rules/files/common/tables.yaml.
stimulus_annotations:
  level: optional
  datatypes:
    - stimuli
  suffixes:
    - annotations
  extensions:
    - .json
    - .tsv
  entities:
    stimulus: required

stimulus_audio:
  level: optional
  datatypes:
    - stimuli
  suffixes:
    - audio
  extensions:
    - .json
    - .wav
    - .flac
    - .mp3
    - .aac
    - .ogg
  entities:
    stimulus: required
    part: optional

stimulus_image:
  level: optional
  datatypes:
    - stimuli
  suffixes:
    - image
  extensions:
    - .json
    - .jpg
    - .png
    - .svg
    - .webp
    - .tif
    - .tiff
  entities:
    stimulus: required
    part: optional

stimulus_video:
  level: optional
  datatypes:
    - stimuli
  suffixes:
    - video
  extensions:
    - .json
    - .mp4
    - .avi
    - .mkv
    - .webm
  entities:
    stimulus: required
    part: optional

stimulus_audiovideo:
  level: optional
  datatypes:
    - stimuli
  suffixes:
    - audiovideo
  extensions:
    - .json
    - .mp4
    - .avi
    - .mkv
    - .webm
  entities:
    stimulus: required
    part: optional

stimulus_annotations_events: # stim-<label>[_part-<label>]_annot-<label>_events.{tsv,json}
  level: optional
  datatypes:
    - stimuli
  suffixes:
    - events
  extensions:
    - .json
    - .tsv
  entities:
    stimulus: required
    annotation: required
    part: optional
